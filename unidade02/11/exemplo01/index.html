<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
    <title>Aula 11 - Exemplo 01</title>
    <style>
        h1 {
            font-size: 50px;  
            text-align: center;       
        }
        div {
            background-color: gray;
            border-top:5px solid coral;
            border-right:5px solid coral;
            border-bottom:5px solid coral;
            border-left:5px solid coral;
        }
        span {
            font-weight: 800;
            font-size: 30px;
            color: crimson;
        }
        img {
            width: 80px;
            border: 1px solid coral;
        }
        p {
            text-align: justify;
            font-family: cursive;
            border: 5px dotted white;
        }
    </style>
</head>
<body>
    <h1>
        Trabalhando com a propriedade border
    </h1>
    <div>
        <img src="img/hot-dog.png" alt="Imagem de um hot dog">
        <span>Hot Dog</span>
        <p>
            Cachorro quente perfeito. A melhor escolha para quem procura um sanduiche com 
            pão, molho especial, salsicha (uma ou duas), maionese artesal e muito queijo.
        </p>
    </div>
</body>
</html>
