<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 14 - Exemplo 01</title>
</head>
<body>    
    <form>
        <h1>Trabalhando com formulários - Login</h1>
        <label for="email">E-mail</label>  
        <br>
        <input type="text" name="email" id="email"
        required placeholder="Informe seu e-mail." size="40" autofocus> <br> 
        <label for="password">Password</label> 
        <br>
        <input type="password" name="password" id="password" size="40" 
        required placeholder="Informe seu password."> 
        <br> <br>
        <button type="submit" value="Enviar" class="button">Enviar</button>
        <button type="reset" value="Limpar" class="button">Limpar</button>
    </form>
</body>
</html>
