<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 12 - Exercicio 02</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: gray;
            font-family: monospace, sans-serif;
        }
        h1 {
            margin-bottom: 20px;
        }
        form {
           background-color: white;
           margin: 10px;
           padding: 20px;
           border-radius: 10px;
        }  
        input {
            padding: 5px 0px;
        }
        .button {
            padding: 5px 10px;
            background-color: coral;
            color: white;
            font-weight: 600;
            border: none;
        }      
    </style>
</head>
<body>    
    <form>
        <h1>Trabalhando com formulários</h1>
        <label for="matricula">Matrícula</label>  <br>
        <input type="text" name="matricula" id="matricula"
        required size="15" placeholder="Informe sua matrícula." autofocus> <br>
        <label for="nome">Nome</label>  <br>
        <input type="text" name="nome" id="nome"
        required size="50" placeholder="Informe seu nome."> <br>
        <label for="email">E-mail</label>  <br>
        <input type="text" name="email" id="email"
        required size="50" placeholder="Informe seu e-mail."> <br> <br>
        <input type="submit" value="Enviar" class="button">
        <input type="reset" value="Limpar" class="button">
    </form>
</body>
</html>
