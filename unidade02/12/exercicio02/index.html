<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
    <title>Aula 12 - Exercício 02</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family:'Courier New', Courier, monospace;
            padding: 20px;
            background-color: gray;
        }
        .main {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }
        h1 {
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            margin-top: 10px;
        }
        input {
            margin: 5px 0;
            padding: 5px 3px;
        }
    </style>
</head>
<body>
    <div class="main">
        <h1>
            Trabalhando com as tags e controles de formulário
        </h1>
        <form action="">
            <label for="matricula">Matrícula</label> <br>
            <input type="text" id="matricula" name="matricula" placeholder="Informe sua matrícula" autofocus> <br>
            <label for="nome">Nome</label> <br>
            <input type="text" id="nome" name="nome" placeholder="Informe seu nome"size="100"> <br>
            <label for="email">E-mail</label><br>
            <input type="text" id="email" name="email" placeholder="Informe seu e-mail" size="100"> <br>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </form>
    </div>
</body>
</html>
