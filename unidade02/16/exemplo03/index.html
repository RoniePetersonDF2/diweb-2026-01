<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/img/favicon.png" type="image/x-icon">
    <title>Aula 16 - Exemplo 03</title>
</head>
<body>
    <h1>Trabalhando com listas e seu atributo - type</h1>

    <h2>Lista não ordenada</h2>
    <!--valores para type: disc (padrão), circle e square -->
    <ul type="square">
        <li>Pão</li>
        <li>Leite</li>
        <li>Ovos</li>
    </ul>

    <h2>Lista ordenada</h2>
    <!--valores para type: disc (padrão), circle e square -->
    <ol type="I">
        <li>Pão</li>
        <li>Leite</li>
        <li>Ovos</li>
    </ol>

</body>
</html>
