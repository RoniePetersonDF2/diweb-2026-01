<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/img/favicon.png" type="image/x-icon">
    <title>Aula 16 - Exemplo 02</title>
</head>
<body>
    <h1>Trabalhando com listas</h1>

    <h2>Lista não ordenada</h2>
    <ul>
        <li>Pão</li>
        <li>Leite</li>
        <li>Ovos</li>
    </ul>

    <h2>Lista ordenada</h2>
    <ol>
        <li>Pão</li>
        <li>Leite</li>
        <li>Ovos</li>
    </ol>

    <h2>Lista aninhada ou hieraquica</h2>
    <ul>
        <li>Pão</li>
        <li>Leite</li>
        <ol>
            <li>Leite integral</li>
            <li>Leite normal</li>
        </ol>
        <li>Ovos</li>
    </ul>
</body>
</html>
