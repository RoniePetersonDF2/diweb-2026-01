<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Exemplo Flexbox</title>
    <link rel='stylesheet' href='main.css'>
    <style>
.grid-container {
  display: grid;
  /* Definindo 3 colunas: a lateral com 200px e o resto flexível */
  grid-template-columns: 200px 1fr 1fr;
  /* Definindo as linhas: altura automática para topo/base e 400px no meio */
  grid-template-rows: auto 400px auto;
  gap: 10px;
  padding: 10px;
  font-family: sans-serif;
}

/* Posicionando os elementos nas "celulas" do Grid */
.header {
  grid-column: 1 / 4; /* Ocupa da linha 1 até a 4 (toda a largura) */
  background-color: #2c3e50;
  color: white;
  padding: 20px;
  text-align: center;
}

.sidebar {
  grid-row: 2 / 3; /* Fica na segunda linha */
  background-color: #ecf0f1;
  padding: 20px;
}

.content {
  grid-column: 2 / 4; /* Ocupa as duas colunas restantes */
  background-color: #bdc3c7;
  padding: 20px;
}

.footer {
  grid-column: 1 / 4; /* Ocupa toda a largura no fundo */
  background-color: #34495e;
  color: white;
  padding: 15px;
  text-align: center;
}
</style>

</head>
<body>
<div class="grid-container">
  <header class="header">Cabeçalho (Logo/Menu)</header>
  <aside class="sidebar">Barra Lateral (Links)</aside>
  <main class="content">Conteúdo Principal (Postagens)</main>
  <footer class="footer">Rodapé (Contatos)</footer>
</div>
</body>
</html>
