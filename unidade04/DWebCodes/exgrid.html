<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Grid</title>
    <style>
        /* 1. ESTILO PARA CONTAINER GRID */
        .container-grid {
            display: grid; /* Ativa o Grid */
            grid-template-columns: repeat(3, 1fr); /* Define 3 colunas de largura igual */
            gap: 15px; /* Espaçamento entre os itens */
            background-color: #ecf0f1; /* Cinza claro */
            padding: 20px;
            border: 2px solid #0a5283;
        }

        /* 2. ESTILO PARA OS ITENS GRID */
        .item-grid {
            background-color: #e74c3c; /* Vermelho */
            color: white;
            padding: 20px;
            border: 3px solid #c0392b;
            text-align: center;
        }

        .item1 { 
            grid-column: 1;
            grid-row: 1; 
        }

        .item2 { 
            grid-column: 2; 
            grid-row: 2; 
        }
        .item3 { 
            grid-column: 3; 
            grid-row: 3; 
        }

        /* Estilo para o corpo da página */
        body {
            font-family: sans-serif;
            padding: 5px;
            background-color: rgb(5, 243, 25);   
        }
        h1{text-align: center;} </style>

</head>
<body>
    <h1>Atividade: Grid</h1>
    <!-- Exemplo de Container Grid -->  
    <div class="container-grid">
        <div class="item-grid item1">Item 1</div>
        <div class="item-grid item2">Item 2</div>
        <div class="item-grid item3">Item 3</div>
    </div>
</body>
</html>
