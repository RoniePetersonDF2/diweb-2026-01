<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Exemplo Flexbox</title>

    <style>
        /* 1. ESTILO PARA CONTAINER FLEX */
        .container-flex {
            display: flex; /* Ativa o Flexbox */
            background-color: #ecf0f1; /* Cinza claro */
            padding: 20px;
            gap: 15px; /* Espaçamento entre os itens */
            border: 2px solid #0a5283;
        }

        /* 2. ESTILO PARA OS ITENS FLEX */
        .item-flex {
            background-color: #e74c3c; /* Vermelho */
            color: white;
            padding: 20px;
            border: 3px solid #c0392b;
            flex: 1; /* Faz com que os itens cresçam igualmente */
            text-align: center;
        }

        /* Estilo para o corpo da página */
        body {
            font-family: sans-serif;
            padding: 5px;
            background-color: rgb(5, 243, 25);   
        }
        h1{text-align: center;} </style>

</head>
<body>
    <h1>Atividade: Flexbox</h1>
    <!-- Exemplo de Container Flex -->  
    <div class="container-flex">
        <div class="item-flex">Item 1</div>
        <div class="item-flex">Item 2</div>
        <div class="item-flex">Item 3</div>
    </div>
</body>
</html>
