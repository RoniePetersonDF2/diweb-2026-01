<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
    <title>Aula 10 - Exemplo 02</title>
    <style>
         h1 {
            font-size: 50px; 
            margin-left: 50px;        
        }
        div {
            background-color: lightgray;
            margin: 10px 50px 10px 50px;
            height: 150px;
        }
        span {
            font-weight: 800;
            font-size: 30px;
            color: crimson;
        }
    </style>
</head>
<body>
    <h1>
        Trabalhando com as tags &lt;div&gt; e &lt;span&gt;
    </h1>
    <div>
        <img src="img/hot-dog.png" alt="Imagem de um hot dog">
        <span>Hot Dog</span>
        <p>
            Cachorro quente perfeito. A melhor escolha para quem procura um sanduiche com 
            pão, molho especial, salsicha (uma ou duas), maionese artesal e muito queijo.
        </p>
    </div>
</body>
</html>
